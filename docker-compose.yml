version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # We pull the llama3 model automatically when the container starts
    command: >
      bash -c "ollama serve & sleep 5 && ollama pull llama3 && wait"

  scanner_app:
    build: .
    container_name: scanner_app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
